name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check JavaScript
        run: for f in $(git ls-files '*.js' '*.mjs'); do node --check "$f"; done

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build WASM module
        run: ./wasm/build.sh

  wgsl:
    runs-on: ubuntu-latest
    env:
      NAGA_VERSION: 30.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache naga-cli
        id: naga-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/naga
          key: naga-cli-${{ env.NAGA_VERSION }}-${{ runner.os }}
      - name: Install naga-cli
        if: steps.naga-cache.outputs.cache-hit != 'true'
        run: cargo install naga-cli --version "$NAGA_VERSION" --locked
      - name: Validate WGSL modules
        run: node tools/validate-wgsl.mjs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: CPU reference tests
        run: node --test 'test/*.test.mjs'

  # Executes selected shipped WGSL kernels on Mesa lavapipe (a CPU-only Vulkan driver) through
  # Dawn's Node bindings and compares the results with the CPU references (test/gpu/, #51).
  # test/gpu/harness.mjs refuses to run unless CI=true and the adapter is a software device.
  gpu-software:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEBGPU_NPM_VERSION: 0.6.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The lavapipe .debs are cached per runner image (#101): a slow Ubuntu mirror once took 8 minutes for the
      # 19 MB mesa-vulkan-drivers download and ran this job into its limit. On a cache hit apt only fetches
      # the package lists; a slow mirror on a miss now fails this step after 4 minutes, by name.
      - name: Runner image (apt cache key)
        id: image
        run: echo "key=apt-lavapipe-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Cache Mesa lavapipe packages
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: ${{ steps.image.outputs.key }}
      - name: Install Mesa lavapipe (software Vulkan)
        timeout-minutes: 4
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update -q -o Acquire::Retries=3
          sudo apt-get install -y -q --no-install-recommends -o Acquire::Retries=3 \
            -o Dir::Cache::Archives="$HOME/apt-archives" -o APT::Keep-Downloaded-Packages=true \
            mesa-vulkan-drivers libvulkan1 vulkan-tools
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
          ls ~/apt-archives
      - name: Force the lavapipe ICD
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
      - name: Software adapter
        run: vulkaninfo --summary
      - name: Install WebGPU runtime (dawn.node)
        run: npm install --no-save --no-package-lock --ignore-scripts "webgpu@$WEBGPU_NPM_VERSION"
      # --test-timeout: the slowest single test seen in CI is ~97 s (maze "experiment size" on a slow runner,
      # 37 s on a fast one), so 180 s fails a hung test by name with ~2x margin; the spec reporter prints
      # "✖ <name> ... test timed out after 180000ms". GPU waits themselves time out after 90 s (harness.mjs).
      - name: GPU kernel tests
        run: >-
          node --test --test-reporter=spec --test-concurrency=2 --test-timeout=180000
          --test-force-exit 'test/gpu/*.gpu.test.mjs'

  # Real-browser regression tests (test/browser/, #77): headless Chromium driven by Playwright on a
  # software WebGPU adapter (Mesa lavapipe or Chromium's SwiftShader), never a real GPU. probe.mjs picks
  # Chromium flags that yield a software adapter and prints it; test/browser/guard.mjs refuses to run
  # unless CI=true on Linux, and global-setup.mjs re-checks the adapter before any test starts.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PLAYWRIGHT_VERSION: 1.64.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The lavapipe .debs are cached per runner image (#101): a slow Ubuntu mirror once took 8 minutes for the
      # 19 MB mesa-vulkan-drivers download and ran this job into its limit. On a cache hit apt only fetches
      # the package lists; a slow mirror on a miss now fails this step after 4 minutes, by name.
      - name: Runner image (apt cache key)
        id: image
        run: echo "key=apt-lavapipe-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Cache Mesa lavapipe packages
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: ${{ steps.image.outputs.key }}
      - name: Install Mesa lavapipe (software Vulkan)
        timeout-minutes: 4
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update -q -o Acquire::Retries=3
          sudo apt-get install -y -q --no-install-recommends -o Acquire::Retries=3 \
            -o Dir::Cache::Archives="$HOME/apt-archives" -o APT::Keep-Downloaded-Packages=true \
            mesa-vulkan-drivers libvulkan1 vulkan-tools
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
          ls ~/apt-archives
      - name: Force the lavapipe ICD
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
      - name: Install Playwright and Chromium (CI only, not saved to package.json)
        timeout-minutes: 4
        run: |
          npm install --no-save --no-package-lock --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION"
          npx playwright install chromium
      # `install --with-deps` apt-installed Chromium's system libraries; on the runner image only optional
      # fonts were missing, and their download from a slow mirror ran the job into its limit (#101). apt now
      # runs only if a shared library of the downloaded browsers is actually missing.
      - name: Chromium system libraries
        timeout-minutes: 4
        run: |
          missing=$(find ~/.cache/ms-playwright -type f \( -name chrome -o -name chrome-headless-shell -o -name headless_shell \) \
            -exec ldd {} \; | grep 'not found' | sort -u || true)
          if [ -n "$missing" ]; then echo "$missing"; npx playwright install-deps chromium; else echo "all shared libraries present"; fi
      - name: Pick Chromium flags for a software WebGPU adapter
        timeout-minutes: 4
        run: node test/browser/probe.mjs
      - name: Browser regression tests
        timeout-minutes: 8
        run: npx playwright test -c test/browser/playwright.config.mjs
