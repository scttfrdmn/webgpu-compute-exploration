name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check JavaScript
        run: for f in $(git ls-files '*.js' '*.mjs'); do node --check "$f"; done

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build WASM module
        run: ./wasm/build.sh

  wgsl:
    runs-on: ubuntu-latest
    env:
      NAGA_VERSION: 30.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache naga-cli
        id: naga-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/naga
          key: naga-cli-${{ env.NAGA_VERSION }}-${{ runner.os }}
      - name: Install naga-cli
        if: steps.naga-cache.outputs.cache-hit != 'true'
        run: cargo install naga-cli --version "$NAGA_VERSION" --locked
      - name: Validate WGSL modules
        run: node tools/validate-wgsl.mjs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: CPU reference tests
        run: node --test 'test/*.test.mjs'

  # Executes selected shipped WGSL kernels on Mesa lavapipe (a CPU-only Vulkan driver) through
  # Dawn's Node bindings and compares the results with the CPU references (test/gpu/, #51).
  # test/gpu/harness.mjs refuses to run unless CI=true and the adapter is a software device.
  gpu-software:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEBGPU_NPM_VERSION: 0.6.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Mesa lavapipe (software Vulkan)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools
      - name: Force the lavapipe ICD
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
      - name: Software adapter
        run: vulkaninfo --summary
      - name: Install WebGPU runtime (dawn.node)
        run: npm install --no-save --no-package-lock --ignore-scripts "webgpu@$WEBGPU_NPM_VERSION"
      - name: GPU kernel tests
        run: >-
          node --test --test-reporter=spec --test-concurrency=2 --test-timeout=240000
          --test-force-exit 'test/gpu/*.gpu.test.mjs'

  # Real-browser regression tests (test/browser/, #77): headless Chromium driven by Playwright on a
  # software WebGPU adapter (Mesa lavapipe or Chromium's SwiftShader), never a real GPU. probe.mjs picks
  # Chromium flags that yield a software adapter and prints it; test/browser/guard.mjs refuses to run
  # unless CI=true on Linux, and global-setup.mjs re-checks the adapter before any test starts.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PLAYWRIGHT_VERSION: 1.64.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Mesa lavapipe (software Vulkan)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools
      - name: Force the lavapipe ICD
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
      - name: Install Playwright and Chromium (CI only, not saved to package.json)
        run: |
          npm install --no-save --no-package-lock --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
      - name: Pick Chromium flags for a software WebGPU adapter
        timeout-minutes: 4
        run: node test/browser/probe.mjs
      - name: Browser regression tests
        timeout-minutes: 8
        run: npx playwright test -c test/browser/playwright.config.mjs
